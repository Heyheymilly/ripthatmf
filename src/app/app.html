<main class="popup">
  <h1>rip that mfgggg</h1>
  <p class="backend-status">Backend: {{ backendStatus() }}</p>
  <section class="track">
    <p class="website">{{ website() }}</p>
    <h2>{{ pageTitle() }}</h2>
  </section>
  @if (status() === 'ripped') {
    Ripped!!!!!!1!!
  } @else {
    <button
  type="button" 
  (click)="rip()"
  [disabled]="status() === 'downloading' || !provider() || !canDownload()"
>
      @if (!provider()){
        No Music
      }@else if (status() === 'downloading') {
        Downloading
      } @else {
        RIP
      }
    </button>
  }
</main>
